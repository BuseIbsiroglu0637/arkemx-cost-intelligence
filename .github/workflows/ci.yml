name: M1 CI (free-tier friendly)
on:
  push:
    branches: [main, feat/m1-metraj-core]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/cost-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/cost-api/pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_a318_pdf_api.py tests/test_a319_gazbeton_safety.py tests/test_a320_smart_matching.py tests/test_a321_candidate_selections.py tests/test_a322_material_safety.py tests/test_a323_ceramic_joint_spacing.py tests/test_a324_ceramic_clarification.py tests/test_a325_review_queue.py tests/test_a326_project_evidence.py tests/test_a327_engineer_handoff.py tests/test_a327_decisions.py tests/test_a327_additional_evidence.py tests/test_a3291_price_audit.py tests/test_a330_editable_engineering.py tests/test_a331_pilot_review.py tests/test_a335_plaster_poz_matching.py tests/test_a337_plaster_operations.py tests/test_a338_plaster_evidence.py tests/test_a3391_unified_plaster_evidence.py
      - run: DATABASE_URL=sqlite:///./migration-ci.db python -m alembic upgrade head
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
