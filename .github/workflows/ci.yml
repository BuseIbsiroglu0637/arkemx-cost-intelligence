name: M1 CI (free-tier friendly)
on:
  push:
    branches: [main, feat/m1-metraj-core]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/cost-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/cost-api/pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_a318_pdf_api.py tests/test_a319_gazbeton_safety.py
      - run: python -m pytest -q
      - run: DATABASE_URL=sqlite:///./migration-ci.db python -m alembic upgrade head
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
