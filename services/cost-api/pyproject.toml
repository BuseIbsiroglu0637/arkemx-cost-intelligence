[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkemx-cost-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.18,<1",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23,<27",
  "email-validator>=2,<3",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external_pdf: requires privately supplied, hash-pinned analysis/auxiliary PDF files"]
